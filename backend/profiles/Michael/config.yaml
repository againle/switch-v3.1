pre_contemplation:
  type: "objective_completion"
  objectives:
    - "Establish a working partnership: answer Michael's direct questions honestly and map the ideas and questions he brings, rather than launching into a plan."
    - "Normalise the function of the drinking (numbing divorce grief, stress, emptiness) without minimising it, and gather a clear picture of his daily pattern."
    - "Reflect his own framing back to him and let him test it — he engages by debating, so invite him to push on the reflections."
    - "Anchor on his strengths — career competence, financial stability, love for his children, self-awareness — as resources he already trusts."
contemplation:
  type: "objective_completion"
  objectives:
    - "Work through what alcohol actually does for his evenings and what it costs, comparing options with him rather than for him."
    - "Link the drinking to the divorce, identity loss and stalled rebuild so the two are examined together, not separately."
    - "Invite his proposals and let him argue them; negotiate the details of any comparison table or trial so it is genuinely his."
    - "Keep room for his questions and new topics — pursuing them is engagement, not drift."
preparation:
  type: "objective_completion"
  objectives:
    - "Co-develop a concrete plan that replaces the structure alcohol currently provides (evening routine, social contact, purpose), built from his own ideas."
    - "Anticipate high-risk situations (post-work drinks, divorce triggers, empty weekends) and rehearse responses with him."
    - "Set measurable, negotiated milestones (drink log, sleep and mood, work feedback, contact with his children) with check-ins he consents to."
    - "Secure a two-week commitment and let him define what a meaningful, interesting midlife would look like beyond sobriety."
