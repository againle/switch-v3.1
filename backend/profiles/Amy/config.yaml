pre_contemplation:
  type: 'objective_completion'
  objectives:
    - "Help Amy identify avoidance as a coping pattern. Gently explore how avoiding medication, follow-up appointments, and communication with her husband serves as a temporary escape but ultimately worsens her condition. These strategies are understandable attempts to escape pain, but they ultimately make everything worse. This must be done without shame or judgment."
    - "Recognize the vicious cycle of exhaustion and an unhealthy lifestyle. Support Amy in seeing that her belief 'I'm too exhausted to change' is part of a self-perpetuating cycle that keeps her trapped. Naming the cycle creates the possibility of breaking it. Her belief 'I'm too exhausted to change' is 100% true in this moment. She is too exhausted. But she doesn't see that her exhaustion is caused and perpetuated by the very patterns she feels too exhausted to change. If she continues to believe exhaustion is a permanent state, she will remain stuck. If she begins to see it as a cycle, she may become curious about where to interrupt it."
    - "Acknowledge the connection between emotional stress and physical symptoms. Help Amy recognize how her chronic stress, exhaustion, and feelings of worthlessness may be triggering or worsening her RA and SLE flare-ups. Help Amy recognize that her chronic stress, exhaustion, and feelings of worthlessness are not separate from her physical illness—they are biologically connected. This reduces self-blame and opens the door to stress management as a legitimate part of treatment."
    - "Normalize her struggles without judgment. Validate that her responses (avoidance, self-reliance, withdrawal) are understandable survival strategies given her immense pressure, reducing shame and defensiveness. Create a therapeutic relationship where Amy feels fully seen and accepted. Reduce the shame that fuels her core beliefs ('I am useless,' 'I am worthless'). Build trust so that she can eventually consider change."
contemplation:
  type: 'objective_completion'
  objectives:
    - "Explore ambivalence about seeking help. Amy is torn. Part of her desperately needs help (financial, childcare, emotional). But another part believes asking for help means 'admitting defeat' about her marriage and proving her parents right. This ambivalence keeps her stuck. Think about the pros and cons of asking for help and knowing the reason for seeking help and her values behind it."
    - "Introduce the concept of 'small steps' toward change. Amy is overwhelmed by the magnitude of her problems (disease, marriage, finances, parenting). The thought of 'changing everything' paralyzes her. Breaking change into microscopic steps makes it feel possible. Shift Amy from 'I have to fix everything' to 'I can do one small thing.'"
    - "Examine the cost of avoidance. Amy uses avoidance to protect herself from pain, but she hasn't fully confronted what avoidance is costing her—in terms of health, her relationship with her daughters, and her future. Do a Cost-Benefit Analysis, help Amy gently explore the long-term consequences of her current patterns. Help Amy connect her current avoidance to her core value, surviving for her daughters."
    - "Challenge the core belief 'I am useless and worthless.' This core belief fuels her depression and hopelessness. It also prevents her from seeking help (because she doesn't believe she deserves it). Challenging it is essential for any lasting change. Help Amy perform cognitive restructuring that gently examines the evidence for and against this belief. Introduce the possibility that her core belief is not a fact—it is a story she has been telling herself, and stories can be rewritten."
    - "Increase awareness of her body's signals. Amy currently reacts to her body only when pain becomes unbearable (taking meds then). This is crisis management, not disease management. Building awareness helps her detect flares early and respond proactively. Shift from helplessness ('the pain is unstoppable') to empowerment ('I can see it coming and respond')."
    - "Identify one area of life she wants to change first. Amy's problems are interconnected (health, family, finances, marriage). Trying to change everything at once is overwhelming. Identifying a starting point creates focus and hope. Help Amy set a realistic, achievable focus for the next phase of work."
    - "Explore the meaning of 'surviving for her daughters.' Amy's daughters are her primary motivation. Deepening her connection to this motivation can fuel her willingness to make changes that feel scary or difficult (like taking meds consistently or asking for help). Transform 'surviving' from a passive state (just getting through) to an active mission (making choices to stay alive and present)."