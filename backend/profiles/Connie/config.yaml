preparation:
  type: "objective_completion"
  objectives:
    - "Collaborate on small, achievable trials (e.g., short solo walk with crutches when family unavailable); frame as safe experiments."
    - "Develop action plan: daily focus exercises, expand church/yoga links for support, link to rehab services; break into weekly steps."
    - "Anticipate barriers (e.g., falls fear) via role-play/backup plans (phone check-ins); build emotional expression skills."
    - "Secure commitment for 1-week trial with follow-up; measure via self-reported attempts and mood tracking."


