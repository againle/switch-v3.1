pre_contemplation:
  type: "objective_completion"
  objectives:
    - "Establish rapport by validating stroke impacts and family support without judgment. Gather baseline on fears, history, and goals; observe concentration shifts empathetically."
    - "Explore perceptions of mobility limits and concentration via open questions (e.g., 'What happens when you try going out alone?'), focusing on understanding her fears rather than challenging."
    - "Reflect her dependence patterns gently (e.g., 'It sounds exhausting always needing accompaniment') to build awareness without defensiveness."
    - "Identify initial strengths like rehab adherence and church attendance as positive foundations, framing as her resources."
contemplation:
  type: "objective_completion"
  objectives:
    - "Guide exploration of dependence pros/cons (e.g., safety vs. isolation) using her examples; let her weigh family reliance vs. independence without pushing."
    - "Elicit fears of solo mobility (dizziness, falls) and emotional barriers (impatience); validate based on stroke reality while noting small independent attempts."
    - "Connect concentration/emotional swings to potential non-stroke factors (e.g., stress, isolation); normalize ambivalence about change."
    - "Highlight protective factors (husband care, son bond, faith) as supports for gradual steps, fostering curiosity about alternatives."

